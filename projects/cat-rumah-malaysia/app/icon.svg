<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Cat Rumah Express">
  <rect width="64" height="64" rx="14" fill="#FFF8EA" />
  <!-- House roof + body -->
  <path d="M14 32 L32 16 L50 32 L50 48 L14 48 Z" fill="none" stroke="#FFD23F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Window (4-pane blue) -->
  <g fill="#4FC3F7">
    <rect x="28" y="32" width="6" height="6" rx="1" />
    <rect x="36" y="32" width="6" height="6" rx="1" />
    <rect x="28" y="40" width="6" height="6" rx="1" />
    <rect x="36" y="40" width="6" height="6" rx="1" />
  </g>
  <!-- Paint roller frame (pink) -->
  <rect x="9" y="34" width="18" height="7" rx="2.5" fill="#E91E63" />
  <rect x="22" y="36.5" width="3" height="2" fill="#023d93" />
  <!-- Roller handle (navy) -->
  <path d="M22 38 L34 50" stroke="#023d93" stroke-width="2.5" stroke-linecap="round" />
  <!-- Splash dots -->
  <circle cx="50" cy="14" r="2.2" fill="#E91E63" />
  <circle cx="55" cy="20" r="1.8" fill="#4FC3F7" />
  <circle cx="48" cy="22" r="1.6" fill="#7CB342" />
</svg>
