<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Factory</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#E7EDF2; --wall:#DCE4EB; --panel:#FFFFFF; --sunk:#F2F5F8; --ink:#14202B; --muted:#5B6874; --line:rgba(20,32,43,.12);
  --steel:#3A4552; --steel-2:#566373; --roller:#9AA6B2;
  /* in progress vs done — the one colour pair the page is read by */
  --build:#E8780C; --build-soft:#FFF1E3; --build-ink:#9A4A00;
  --live:#15803D;  --live-soft:#E6F6EC;  --live-ink:#0F5C2C;
  --shadow:0 1px 2px rgba(20,48,80,.08),0 6px 16px rgba(20,48,80,.08);
  --font:"Fira Sans",system-ui,sans-serif;
  --r-card:12px; --r-pill:999px; --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E151C; --wall:#131C25; --panel:#1A2530; --sunk:#141E28; --ink:#E9EFF4; --muted:#93A1AE; --line:rgba(233,239,244,.10);
  --steel:#2A3542; --steel-2:#3B4858; --roller:#5D6B7A;
  --build:#FF9A3D; --build-soft:#33210F; --build-ink:#FFC48A;
  --live:#34D27A;  --live-soft:#0F2E1D;  --live-ink:#8CEBB3;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;letter-spacing:-.015em}
img{display:block}
.wrap{max-width:1440px;margin:0 auto;padding:18px 16px 48px}
@media (min-width:760px){.wrap{padding:26px 28px 64px}}

/* ---- top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:60px;height:60px;object-fit:contain;flex:none}
.top h1{font-size:32px;font-weight:800}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-pill);font-weight:700;font-size:15px;white-space:nowrap}
.chip.build{background:var(--build-soft);color:var(--build-ink)}
.chip.live{background:var(--live-soft);color:var(--live-ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.build{background:var(--build);animation:pulse 1.6s infinite}
.dot.live{background:var(--live)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--build) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

section{margin-top:26px}
section>h2{font-size:20px;margin-bottom:10px}

/* ---- the line: robots at their stations over a moving belt.
   Every station is a fixed-size tile that wraps, so nothing can spill into its neighbour. */
.floor{background:var(--wall);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.stations{list-style:none;margin:0;padding:14px 12px 10px;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.stations{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.stations{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1360px){.stations{grid-template-columns:repeat(10,minmax(0,1fr))}}
.station{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 8px;border-radius:var(--r-card);background:color-mix(in srgb,var(--panel) 55%,transparent)}
.station.busy{background:var(--panel);box-shadow:var(--shadow);outline:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.robot{position:relative;width:80px;height:80px;flex:none}
.robot img{width:80px;height:80px;object-fit:contain}
.station.idle .robot img{filter:grayscale(1);opacity:.4}
.station.busy .robot img{animation:work .9s var(--ease) infinite alternate}
@keyframes work{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.gear{position:absolute;right:-8px;top:-4px;width:24px;height:24px;color:var(--c);animation:spin 2.4s linear infinite}
.station.idle .gear{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.count{position:absolute;left:-8px;top:-4px;background:var(--c);color:#fff;border-radius:var(--r-pill);font-size:12px;font-weight:700;padding:1px 7px}
.station b{display:block;font-size:16px;margin-top:4px}
.station small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.station.busy b{color:var(--c)}
.task{width:100%;margin-top:8px;font-size:12.5px;line-height:1.3;text-align:left;background:var(--sunk);border-radius:8px;padding:6px 8px}
.task strong{display:block;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.station.idle .task{background:none;text-align:center;color:var(--muted)}

.belt{height:22px;position:relative;overflow:hidden;background:var(--steel);border-top:3px solid var(--steel-2);border-bottom:3px solid var(--steel-2)}
.belt::before{content:"";position:absolute;inset:0 -40px;background:repeating-linear-gradient(90deg,transparent 0 28px,var(--roller) 28px 32px);opacity:.55;animation:roll 1.4s linear infinite}
@keyframes roll{to{transform:translateX(32px)}}
.legs{height:14px;background:repeating-linear-gradient(90deg,transparent 0 60px,var(--steel-2) 60px 66px,transparent 66px 124px)}

/* websites riding the belt: each sits over its station and slides on when it moves */
.markers{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));padding:4px 0 0}
.markers img{width:26px;height:26px;margin:0 auto;object-fit:contain}
@media (min-width:1360px){.markers{display:none}}
.packages{position:relative;height:var(--h,44px);transition:height .4s var(--ease)}
.pkg{position:absolute;bottom:calc(var(--row) * 34px + 4px);left:var(--x);width:min(128px,calc(10% - 6px));margin-left:calc(min(128px,calc(10% - 6px)) / -2);
  transition:left 1.2s var(--ease),bottom .4s var(--ease)}
.pkg .box{display:block;background:var(--panel);border:2px solid var(--build);border-radius:7px;box-shadow:var(--shadow);overflow:hidden;font-size:11.5px;font-weight:700;line-height:1;color:var(--ink);text-decoration:none}
.pkg .box::before{content:"";display:block;height:6px;background:var(--build)}
.pkg .box span{display:block;padding:5px 6px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkg.working .box{animation:ride 1.1s var(--ease) infinite alternate}
.pkg.waiting .box{border-style:dashed}
@keyframes ride{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.pkg.new .box{animation:drop .6s var(--ease)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
@media (max-width:859px){.pkg .box span{display:none}.pkg .box{height:20px}}

/* ---- every website on the line, all visible */
.grid{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.product{background:var(--panel);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;border:2px solid var(--build);min-width:0;display:flex;flex-direction:column}
.product .bar{display:flex;gap:5px;align-items:center;padding:6px 10px;background:var(--build)}
.product .bar i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.75)}
.product .bar span{margin-left:auto;color:#fff;font-size:12px;font-weight:700}
.product .body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.product h3{font-size:18px;overflow-wrap:anywhere}
.at{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.at img{width:34px;height:34px;object-fit:contain;flex:none}
.at b{color:var(--ink)}
.product p{margin:0;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:auto}
.steps i{height:6px;border-radius:3px;background:var(--build-soft)}
.steps i.past{background:color-mix(in srgb,var(--build) 55%,transparent)}
.steps i.here{background:var(--build)}
.foot{font-size:12.5px;color:var(--muted)}
.product.waiting{border-style:dashed}
.product.arrive{animation:arrive .7s var(--ease)}
@keyframes arrive{from{transform:translateY(-14px);opacity:0}}

/* ---- shipped bay */
.crate{background:var(--live-soft);border:2px solid var(--live);border-radius:var(--r-card);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;box-shadow:var(--shadow);min-width:0}
.crate .tick{grid-row:span 3;align-self:start;width:36px;height:36px;border-radius:10px;background:var(--live);color:#fff;display:grid;place-items:center}
.crate .tick svg{width:22px;height:22px}
.crate b{font-size:15px;overflow-wrap:anywhere}
.crate a{font-size:18px;font-weight:700;color:var(--live-ink);text-decoration:none;overflow-wrap:anywhere;width:fit-content;border-radius:4px}
.crate a:hover{text-decoration:underline}
.crate a:focus-visible{outline:2px solid var(--live);outline-offset:3px}
.crate small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);background:var(--panel);border-radius:var(--r-card);padding:18px;text-align:center;grid-column:1/-1}

@media (prefers-reduced-motion:reduce){
  .station.busy .robot img,.gear,.belt::before,.dot.build,.product.arrive,.pkg .box{animation:none}
  .pkg,.packages{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="/icon.png" alt="" width="60" height="60">
      <div><h1>Website Factory</h1><p id="conn">Connecting…</p></div></div>
    <div class="tally" id="tally"></div>
  </header>

  <section aria-labelledby="floor-h">
    <h2 id="floor-h">Production line</h2>
    <div class="floor">
      <ul class="stations" id="stations"></ul>
      <div class="markers" id="markers" aria-hidden="true"></div>
      <div class="packages" id="packages" aria-label="Websites on the belt"></div>
      <div class="belt" aria-hidden="true"></div><div class="legs" aria-hidden="true"></div>
    </div>
  </section>

  <section aria-labelledby="run-h">
    <h2 id="run-h">On the line now</h2>
    <ul class="grid" id="running"></ul>
  </section>

  <section aria-labelledby="bay-h">
    <h2 id="bay-h">Shipped today</h2>
    <ul class="grid" id="bay"></ul>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gear" viewBox="0 0 24 24"><path fill="currentColor" d="M10.3 2h3.4l.5 2.6a7.6 7.6 0 0 1 1.9.8l2.2-1.5 2.4 2.4-1.5 2.2c.3.6.6 1.2.8 1.9l2.6.5v3.4l-2.6.5a7.6 7.6 0 0 1-.8 1.9l1.5 2.2-2.4 2.4-2.2-1.5c-.6.3-1.2.6-1.9.8l-.5 2.6h-3.4l-.5-2.6a7.6 7.6 0 0 1-1.9-.8l-2.2 1.5-2.4-2.4 1.5-2.2a7.6 7.6 0 0 1-.8-1.9L2 13.7v-3.4l2.6-.5c.2-.7.5-1.3.8-1.9L3.9 5.7l2.4-2.4 2.2 1.5c.6-.3 1.2-.6 1.9-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>
  <symbol id="shipped" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m6.5 12.5 3.5 3.5 7.5-8"/></symbol>
</svg>

<script>
// Stations in the order a website moves down the line (agents/*.md).
const ORDER = ["alpha","lylia","sora","nana","kagura","kimmy","cyclops","hanabi","layla","gloo"];
let snap = null, serverSkew = 0;
const lastStation = new Map(); // site → station it was drawn at, to animate a move

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => Date.now() + serverSkew;
function ago(t){
  if (!t) return "";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m ago";
}
const agoEl = (t) => `<time data-t="${t || ""}">${ago(t)}</time>`;

function renderStations(agents, building){
  // A robot is busy while a website at its station has an agent working on it,
  // so the line and the cards below always agree.
  document.getElementById("stations").innerHTML = ORDER.map((key) => {
    const a = agents[key];
    const here = building.filter((s) => s.station === key && s.working > 0);
    const top = here[0];
    const task = top
      ? `<div class="task"><strong>${esc(here.map((s) => s.name).join(", "))}</strong><span>${esc(top.now)}</span></div>`
      : `<div class="task">Free</div>`;
    return `<li class="station ${top ? "busy" : "idle"}" style="--c:${a.color}">
      <div class="robot"><img src="/agents/${key}.png" alt="" width="80" height="80">${here.length > 1 ? `<span class="count">×${here.length}</span>` : ""}<svg class="gear"><use href="#gear"/></svg></div>
      <b>${a.name}</b><small>${esc(a.role)}</small>${task}</li>`;
  }).join("");
}

// Packages are kept between renders (keyed by site) so a station change
// animates as a slide along the belt instead of a jump.
function renderBelt(building){
  document.getElementById("markers").innerHTML = ORDER.map((k) => `<img src="/agents/${k}.png" alt="">`).join("");
  const box = document.getElementById("packages");
  const rows = new Map();
  const seen = new Set();
  for (const s of building) {
    const idx = s.station ? ORDER.indexOf(s.station) : -1;
    const row = rows.get(idx) || 0;
    rows.set(idx, row + 1);
    seen.add(s.key);
    let el = box.querySelector(`[data-key="${CSS.escape(s.key)}"]`);
    if (!el) {
      el = document.createElement("div");
      el.dataset.key = s.key;
      el.className = "pkg new";
      el.innerHTML = `<span class="box"><span></span></span>`;
      box.appendChild(el);
      setTimeout(() => el.classList.remove("new"), 700);
    }
    el.classList.toggle("working", s.working > 0);
    el.classList.toggle("waiting", s.waitingOnYou);
    el.title = `${s.name}: ${s.station ? "at " + snap.agents[s.station].name : "intake"}`;
    el.querySelector(".box span").textContent = s.name;
    // Intake sits at the very start of the belt, before Alpha.
    el.style.setProperty("--x", idx < 0 ? "64px" : `${(idx + 0.5) * 10}%`);
    el.style.setProperty("--row", row);
  }
  for (const el of [...box.children]) if (!seen.has(el.dataset.key)) el.remove();
  box.style.setProperty("--h", `${Math.max(1, ...rows.values()) * 34 + 10}px`);
}

function product(s, agents){
  const idx = s.station ? ORDER.indexOf(s.station) : -1;
  const moved = lastStation.has(s.key) && lastStation.get(s.key) !== s.station;
  lastStation.set(s.key, s.station);
  const a = s.station ? agents[s.station] : null;
  const at = a
    ? `<div class="at"><img src="/agents/${s.station}.png" alt=""><span>At <b>${esc(a.name)}</b> · ${esc(a.role)}</span></div>`
    : `<div class="at"><img src="/icon.png" alt=""><span>Started, no station yet</span></div>`;
  const steps = ORDER.map((_, i) => `<i class="${i < idx ? "past" : i === idx ? "here" : ""}"></i>`).join("");
  return `<li class="product${s.waitingOnYou ? " waiting" : ""}${moved ? " arrive" : ""}">
    <div class="bar"><i></i><i></i><i></i><span>${s.waitingOnYou ? "Needs you" : "Building"}</span></div>
    <div class="body"><h3>${esc(s.name)}</h3>${at}${s.now ? `<p>${esc(s.now)}</p>` : ""}
      <div class="steps" title="Station ${idx + 1} of ${ORDER.length}">${steps}</div>
      <div class="foot">${s.working ? `${s.working} ${s.working === 1 ? "agent" : "agents"} working · ` : ""}${agoEl(s.lastAt)}</div></div></li>`;
}

function render(){
  if (!snap) return;
  const { agents, sites } = snap;
  const building = sites.filter((s) => s.state === "building");
  const done = sites.filter((s) => s.state === "done");
  document.getElementById("tally").innerHTML =
    `<span class="chip build"><span class="dot build"></span>${building.length} building</span>` +
    `<span class="chip live"><span class="dot live"></span>${done.length} live</span>`;
  renderStations(agents, building);
  renderBelt(building);
  document.getElementById("running").innerHTML = building.length
    ? building.map((s) => product(s, agents)).join("")
    : `<li class="empty">No website on the line right now. Start a build and it shows up here within a few seconds.</li>`;
  document.getElementById("bay").innerHTML = done.length
    ? done.map((s) => `<li class="crate"><span class="tick" aria-hidden="true"><svg><use href="#shipped"/></svg></span>${s.name !== s.domain ? `<b>${esc(s.name)}</b>` : ""}
        <a href="https://${esc(s.domain)}" target="_blank" rel="noopener">${esc(s.domain)}</a><small>Live · shipped ${agoEl(s.lastAt)}</small></li>`).join("")
    : `<li class="empty">Nothing shipped yet today. Finished websites land here with their live link.</li>`;
}

function connect(){
  const conn = document.getElementById("conn");
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    snap = JSON.parse(ev.data);
    serverSkew = snap.now - Date.now();
    conn.textContent = "Live from the Claude sessions on this machine";
    render();
  };
  es.onerror = () => { conn.textContent = "Lost the factory server. Retrying… (is server.mjs still running?)"; };
}
connect();
// Tick the "Xs ago" labels without a re-render.
setInterval(() => document.querySelectorAll("time[data-t]").forEach((t) => { if (t.dataset.t) t.textContent = ago(+t.dataset.t); }), 1000);
</script>
</body>
</html>
