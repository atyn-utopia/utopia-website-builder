<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Factory</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#E7EDF2; --wall:#DCE4EB; --panel:#FFFFFF; --sunk:#F2F5F8; --ink:#14202B; --muted:#5B6874; --line:rgba(20,32,43,.12);
  --steel:#3A4552; --steel-2:#566373; --roller:#9AA6B2;
  /* in progress vs done — the one colour pair the page is read by */
  --build:#E8780C; --build-soft:#FFF1E3; --build-ink:#9A4A00;
  --live:#15803D;  --live-soft:#E6F6EC;  --live-ink:#0F5C2C;
  --shadow:0 1px 2px rgba(20,48,80,.08),0 6px 16px rgba(20,48,80,.08);
  --font:"Fira Sans",system-ui,sans-serif;
  --r-card:12px; --r-pill:999px; --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E151C; --wall:#131C25; --panel:#1A2530; --sunk:#141E28; --ink:#E9EFF4; --muted:#93A1AE; --line:rgba(233,239,244,.10);
  --steel:#2A3542; --steel-2:#3B4858; --roller:#5D6B7A;
  --build:#FF9A3D; --build-soft:#33210F; --build-ink:#FFC48A;
  --live:#34D27A;  --live-soft:#0F2E1D;  --live-ink:#8CEBB3;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;letter-spacing:-.015em}
img{display:block}
.wrap{max-width:1440px;margin:0 auto;padding:18px 16px 48px}
@media (min-width:760px){.wrap{padding:26px 28px 64px}}

/* ---- top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:60px;height:60px;object-fit:contain}
.top h1{font-size:32px;font-weight:800}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-pill);font-weight:700;font-size:15px;white-space:nowrap}
.chip.build{background:var(--build-soft);color:var(--build-ink)}
.chip.live{background:var(--live-soft);color:var(--live-ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.build{background:var(--build);animation:pulse 1.6s infinite}
.dot.live{background:var(--live)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--build) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

section{margin-top:26px}
section>h2{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:10px}

/* ---- the factory floor */
.floor{background:var(--wall);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto;overscroll-behavior-x:contain}
.line{display:grid;grid-template-columns:repeat(var(--cols),minmax(124px,1fr));min-width:calc(var(--cols) * 124px);padding:16px 0 0}
.station{display:grid;grid-template-rows:66px auto auto 1fr;justify-items:center;padding:0 6px;min-width:0;position:relative}
.station + .station::before{content:"";position:absolute;left:0;top:70px;height:96px;border-left:1px dashed var(--line)}

.say{align-self:end;max-width:100%;background:var(--panel);border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.3;box-shadow:var(--shadow);margin-bottom:8px;text-align:left}
.say b{display:block;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.say span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.say:empty{visibility:hidden}

.robot{position:relative;width:84px;height:84px}
.robot img{width:84px;height:84px;object-fit:contain}
.station.idle .robot img{filter:grayscale(1);opacity:.4}
.station.busy .robot img{animation:work .9s var(--ease) infinite alternate}
@keyframes work{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.gear{position:absolute;right:-6px;top:-4px;width:26px;height:26px;color:var(--c);animation:spin 2.4s linear infinite}
.station.idle .gear{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.count{position:absolute;left:-6px;top:-4px;background:var(--c);color:#fff;border-radius:var(--r-pill);font-size:12px;font-weight:700;padding:1px 7px}
.name{text-align:center;margin-top:4px}
.name b{display:block;font-size:16px}
.name small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.station.busy .name b{color:var(--c)}

/* products sit on the belt */
.lane{align-self:stretch;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 0 8px;min-height:120px}
.belt{grid-column:1/-1;height:22px;position:relative;overflow:hidden;background:var(--steel);border-top:3px solid var(--steel-2);border-bottom:3px solid var(--steel-2)}
.belt::before{content:"";position:absolute;inset:0 -40px 0 -40px;background:repeating-linear-gradient(90deg,transparent 0 28px,var(--roller) 28px 32px);opacity:.55;animation:roll 1.4s linear infinite}
@keyframes roll{to{transform:translateX(32px)}}
.legs{grid-column:1/-1;height:16px;background:repeating-linear-gradient(90deg,transparent 0 60px,var(--steel-2) 60px 66px,transparent 66px 124px)}

.product{background:var(--panel);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;font-size:13px;border:2px solid var(--build)}
.product .bar{display:flex;gap:4px;align-items:center;padding:4px 6px;background:var(--build)}
.product .bar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.75)}
.product .bar span{margin-left:auto;color:#fff;font-size:11px;font-weight:700;font-style:normal}
.product .body{padding:6px 8px 8px}
.product b{display:block;font-size:13.5px;overflow-wrap:anywhere;line-height:1.2}
.product p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.progress{height:5px;border-radius:3px;background:var(--build-soft);margin-top:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--build);transform-origin:left;transform:scaleX(var(--p))}
.product.waiting{border-style:dashed}
.product.arrive{animation:arrive .7s var(--ease)}
@keyframes arrive{from{transform:translateX(-60px);opacity:0}}

/* ---- shipped bay */
.bay{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.bay{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.bay{grid-template-columns:repeat(4,minmax(0,1fr))}}
.crate{background:var(--live-soft);border:2px solid var(--live);border-radius:var(--r-card);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;box-shadow:var(--shadow)}
.crate svg{grid-row:span 3;width:34px;height:34px;color:var(--live)}
.crate b{font-size:15px;overflow-wrap:anywhere}
.crate a{font-size:18px;font-weight:700;color:var(--live-ink);text-decoration:none;overflow-wrap:anywhere;width:fit-content;border-radius:4px}
.crate a:hover{text-decoration:underline}
.crate a:focus-visible{outline:2px solid var(--live);outline-offset:3px}
.crate small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);background:var(--panel);border-radius:var(--r-card);padding:18px;text-align:center}

/* ---- phone: the line runs top to bottom */
@media (max-width:759px){
  .floor{overflow:visible;background:none;box-shadow:none}
  .line{display:block;min-width:0;padding:0;position:relative}
  .line::before{content:"";position:absolute;left:41px;top:20px;bottom:20px;width:8px;border-radius:4px;background:var(--steel)}
  .belt,.legs{display:none}
  .station{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;justify-items:stretch;padding:8px 0}
  .station + .station::before{display:none}
  .robot{grid-row:1/3;align-self:start;background:var(--bg);border-radius:50%}
  .name{text-align:left;margin:0;grid-column:2}
  .say{grid-column:2;grid-row:2;margin:6px 0 0;align-self:start}
  .lane{grid-column:2;min-height:0;padding:6px 0 0}
  /* the product card already says what's happening; one copy is enough on a phone */
  .say,.station.idle .lane:empty{display:none}
}
@media (prefers-reduced-motion:reduce){
  .station.busy .robot img,.gear,.belt::before,.dot.build,.product.arrive{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="/icon.png" alt="" width="60" height="60">
      <div><h1>Website Factory</h1><p id="conn">Connecting…</p></div></div>
    <div class="tally" id="tally"></div>
  </header>

  <section aria-labelledby="floor-h">
    <h2 id="floor-h">Production line</h2>
    <div class="floor"><div class="line" id="line"></div></div>
  </section>

  <section aria-labelledby="bay-h">
    <h2 id="bay-h">Shipped today</h2>
    <ul class="bay" id="bay"></ul>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gear" viewBox="0 0 24 24"><path fill="currentColor" d="M10.3 2h3.4l.5 2.6a7.6 7.6 0 0 1 1.9.8l2.2-1.5 2.4 2.4-1.5 2.2c.3.6.6 1.2.8 1.9l2.6.5v3.4l-2.6.5a7.6 7.6 0 0 1-.8 1.9l1.5 2.2-2.4 2.4-2.2-1.5c-.6.3-1.2.6-1.9.8l-.5 2.6h-3.4l-.5-2.6a7.6 7.6 0 0 1-1.9-.8l-2.2 1.5-2.4-2.4 1.5-2.2a7.6 7.6 0 0 1-.8-1.9L2 13.7v-3.4l2.6-.5c.2-.7.5-1.3.8-1.9L3.9 5.7l2.4-2.4 2.2 1.5c.6-.3 1.2-.6 1.9-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m8.5 15.2 1.6 1.6 3-3.2"/></symbol>
</svg>

<script>
// Stations in the order a website moves down the line (agents/*.md).
const ORDER = ["alpha","lylia","sora","nana","kagura","kimmy","cyclops","hanabi","layla","gloo"];
let snap = null, serverSkew = 0;
const lastStation = new Map(); // site → station it was drawn at, to animate a move

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => Date.now() + serverSkew;
function ago(t){
  if (!t) return "";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m ago";
}
const agoEl = (t) => `<time data-t="${t || ""}">${ago(t)}</time>`;

function product(s, at){
  const step = at === "intake" ? 0 : ORDER.indexOf(at) + 1;
  const moved = lastStation.has(s.key) && lastStation.get(s.key) !== at;
  lastStation.set(s.key, at);
  return `<div class="product${s.waitingOnYou ? " waiting" : ""}${moved ? " arrive" : ""}">
    <div class="bar"><i></i><i></i><i></i><span>${s.waitingOnYou ? "Needs you" : "Building"}</span></div>
    <div class="body"><b>${esc(s.name)}</b>${s.now ? `<p>${esc(s.now)}</p>` : ""}
      <div class="progress" title="Station ${step} of ${ORDER.length}"><i style="--p:${Math.max(step, 0.4) / ORDER.length}"></i></div></div></div>`;
}

function renderLine(actors, agents, sites){
  const building = sites.filter((s) => s.state === "building");
  const intake = building.filter((s) => !s.station);
  const stations = intake.length ? ["intake", ...ORDER] : ORDER;
  // Only work on a website on the line lights a robot.
  const onLine = new Set(sites.map((s) => s.key));
  const busy = actors.filter((a) => a.status === "working" && a.doing && onLine.has(a.siteKey));
  const line = document.getElementById("line");
  line.style.setProperty("--cols", stations.length);
  line.innerHTML = stations.map((key) => {
    const here = key === "intake" ? intake : building.filter((s) => s.station === key);
    const lane = here.map((s) => product(s, key)).join("");
    if (key === "intake") {
      return `<div class="station idle" style="--c:var(--muted)"><div class="say"></div>
        <div class="robot"><img src="/icon.png" alt=""></div>
        <div class="name"><b>Intake</b><small>Started, no station yet</small></div><div class="lane">${lane}</div></div>`;
    }
    const a = agents[key];
    const runs = busy.filter((x) => x.doing === key);
    const top = runs[0];
    const say = top ? `<b>${esc(top.site || "")}</b><span>${esc(top.current?.text || top.task || "")}</span>` : "";
    return `<div class="station ${top ? "busy" : "idle"}" style="--c:${a.color}">
      <div class="say">${say}</div>
      <div class="robot"><img src="/agents/${key}.png" alt="">${runs.length > 1 ? `<span class="count">×${runs.length}</span>` : ""}<svg class="gear"><use href="#gear"/></svg></div>
      <div class="name"><b>${a.name}</b><small>${esc(a.role)}</small></div>
      <div class="lane">${lane}</div></div>`;
  }).join("") + `<div class="belt" aria-hidden="true"></div><div class="legs" aria-hidden="true"></div>`;
}

function renderBay(sites){
  const done = sites.filter((s) => s.state === "done");
  document.getElementById("bay").innerHTML = done.length
    ? done.map((s) => `<li class="crate"><svg><use href="#box"/></svg>${s.name !== s.domain ? `<b>${esc(s.name)}</b>` : ""}
        <a href="https://${esc(s.domain)}" target="_blank" rel="noopener">${esc(s.domain)}</a><small>Live · shipped ${agoEl(s.lastAt)}</small></li>`).join("")
    : `<li class="empty">Nothing shipped yet today. Finished websites land here with their live link.</li>`;
}

function render(){
  if (!snap) return;
  const { actors, agents, sites } = snap;
  const b = sites.filter((s) => s.state === "building").length;
  document.getElementById("tally").innerHTML =
    `<span class="chip build"><span class="dot build"></span>${b} building</span>` +
    `<span class="chip live"><span class="dot live"></span>${sites.length - b} live</span>`;
  renderLine(actors, agents, sites);
  renderBay(sites);
}

function connect(){
  const conn = document.getElementById("conn");
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    snap = JSON.parse(ev.data);
    serverSkew = snap.now - Date.now();
    conn.textContent = "Live from the Claude sessions on this machine";
    render();
  };
  es.onerror = () => { conn.textContent = "Lost the factory server. Retrying… (is server.mjs still running?)"; };
}
connect();
// Tick the "Xs ago" labels without a re-render.
setInterval(() => document.querySelectorAll("time[data-t]").forEach((t) => { if (t.dataset.t) t.textContent = ago(+t.dataset.t); }), 1000);
</script>
</body>
</html>
