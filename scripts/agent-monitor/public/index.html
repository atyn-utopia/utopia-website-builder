<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Factory</title>
<link rel="icon" href="/brand/logo-mark-light.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/brand/app-180.png">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Utopia Brand CI v2.0.1 tokens (utopiagroup.com.my/brand-ci) */
:root{
  --paper:#F4F4F2; --bone:#E8E6E1; --linen:#F8F7F4; --panel:#FFFFFF;
  --ink:#17181C; --muted:#5F6268; --line:rgba(23,24,28,.10);
  --blue:#2774AE; --slate:#2A2C32; --concrete:#7A7D82; --ash:#B5B7BC;
  /* in progress = CI warning amber, done = CI live green */
  --build:#F5C13D; --build-soft:#F8EBC6; --build-ink:#5A4100; --on-build:#17181C;
  --live:#3DDC97;  --live-soft:#E3F4EA;  --live-ink:#0E6E5C;  --on-live:#0B0B0D;
  --shadow:0 4px 14px rgba(0,84,166,.08),0 1px 3px rgba(11,11,13,.06);
  --display:"Plus Jakarta Sans",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  --r-button:8px; --r-card:12px; --r-lg:16px; --r-pill:999px;
  --ease:cubic-bezier(.22,1,.36,1); --dur-hover:220ms; --dur-layout:320ms;
  --logo-light:block; --logo-dark:none;
  --card-h:152px; --crate-h:48px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B0B0D; --bone:#111215; --linen:#1C1D22; --panel:#15161A;
  --ink:#F4F4F2; --muted:#B5B7BC; --line:rgba(244,244,242,.10);
  --blue:#4A9DD0; --slate:#2A2C32; --concrete:#3B3D44; --ash:#5D6068;
  --build:#F5C13D; --build-soft:#2E2711; --build-ink:#F5D78A; --on-build:#17181C;
  --live:#3DDC97;  --live-soft:#0F2A1F; --live-ink:#3DDC97;  --on-live:#0B0B0D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --logo-light:none; --logo-dark:block;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.2;margin:0;letter-spacing:-.02em}
img{display:block}
button{font:inherit}

/* One screen, no scrolling, on anything wall- or laptop-sized. Phones scroll. */
.app{max-width:1600px;margin:0 auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px) and (min-height:620px){
  html,body{height:100%;overflow:hidden}
  .app{height:100dvh;padding:18px 24px 12px}
  .bottom{flex:1;min-height:0}
}

/* ---- header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.top h1 img{height:60px;width:auto}
.top h1 .dark,.credit .dark{display:var(--logo-dark)}
.top h1 .light,.credit .light{display:var(--logo-light)}
.conn{color:var(--muted);font-size:13px}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-pill);font:700 15px/1 var(--display);white-space:nowrap}
.chip.build{background:var(--build-soft);color:var(--build-ink)}
.chip.live{background:var(--live-soft);color:var(--live-ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.build{background:var(--build);animation:pulse 1.6s infinite}
.dot.live{background:var(--live)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--build) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:32px}
.panel-h h2{font-size:18px}
.panel-h{gap:10px}
.hicon{width:30px;height:30px;border-radius:var(--r-button);display:grid;place-items:center;flex:none}
.hicon svg{width:18px;height:18px}
.hicon.build{background:var(--build);color:#fff}
.hicon.live{background:var(--live);color:#fff}

/* ---- the line */
.floor{background:var(--bone);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;flex:none}
.stations{list-style:none;margin:0;padding:12px 10px 8px;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.stations{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:900px){.stations{grid-template-columns:repeat(10,minmax(0,1fr))}}
.station{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 6px 8px;border-radius:var(--r-card);background:color-mix(in srgb,var(--panel) 55%,transparent)}
.station{--ct:var(--c)}
/* agent colours are tuned for light; on dark, lift them so navy/grey agents don't sink */
@media (prefers-color-scheme:dark){.station{--ct:color-mix(in srgb,var(--c) 55%,#fff)}}
.station.busy{background:var(--panel);box-shadow:var(--shadow);outline:2px solid color-mix(in srgb,var(--ct) 60%,transparent)}
.robot{position:relative;width:64px;height:64px;flex:none}
.robot img{width:64px;height:64px;object-fit:contain}
.station.idle .robot img{filter:grayscale(1);opacity:.4}
.station.busy .robot img{animation:work .9s var(--ease) infinite alternate}
@keyframes work{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}
.gear{position:absolute;right:-8px;top:-4px;width:22px;height:22px;color:var(--ct);animation:spin 2.4s linear infinite}
.station.idle .gear{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.count{position:absolute;left:-8px;top:-4px;background:var(--c);color:#fff;border-radius:var(--r-pill);font:700 11px/1.5 var(--display);padding:0 6px}
.station b{display:block;font:800 15px/1.2 var(--display);margin-top:4px}
.station small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.station.busy b{color:var(--ct)}
.task{width:100%;margin-top:6px;font-size:11.5px;line-height:1.3;text-align:left;background:var(--linen);border-radius:var(--r-button);padding:5px 7px;min-height:44px}
.task strong{display:block;color:var(--ct);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.station.idle .task{background:none;text-align:center;color:var(--muted);display:grid;place-items:center}

/* websites riding the belt over their station */
.markers{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));padding:2px 0 0}
.markers img{width:24px;height:24px;margin:0 auto;object-fit:contain}
@media (min-width:900px){.markers{display:none}}
.packages{position:relative;height:var(--h,40px);transition:height var(--dur-layout) var(--ease)}
/* each package is exactly as wide as the station tile above it (same padding and gap as .stations) */
.packages{--pad:10px;--gap:8px}
@media (max-width:899px){.packages{--pad:0px;--gap:0px}}
.pkg{--tile:calc((100% - 2 * var(--pad) - 9 * var(--gap)) / 10);position:absolute;bottom:calc(var(--row) * 30px + 4px);left:calc(var(--pad) + var(--i) * (var(--tile) + var(--gap)));width:var(--tile);transition:left 1.2s var(--ease),bottom var(--dur-layout) var(--ease)}
.pkg .box{display:block;background:var(--panel);border:2px solid var(--build);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;font:700 11px/1 var(--display);color:var(--ink)}
.pkg .box::before{content:"";display:block;height:5px;background:var(--build)}
.pkg .box span{display:block;padding:4px 6px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkg.more .box{text-align:center;color:var(--muted)}
.pkg.working .box{animation:ride 1.1s var(--ease) infinite alternate}
.pkg.waiting .box{border-style:dashed}
.pkg.paused .box{border-color:var(--ash);color:var(--muted)}
.pkg.paused .box::before{background:var(--ash)}
@keyframes ride{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.pkg.new .box{animation:drop .6s var(--ease)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
@media (max-width:899px){.pkg{padding:0 3px}.pkg .box span{display:none}.pkg .box{height:18px}}
.belt{height:20px;position:relative;overflow:hidden;background:var(--slate);border-top:3px solid var(--concrete);border-bottom:3px solid var(--concrete)}
.belt::before{content:"";position:absolute;inset:0 -40px;background:repeating-linear-gradient(90deg,transparent 0 28px,var(--ash) 28px 32px);opacity:.5;animation:roll 1.4s linear infinite}
@keyframes roll{to{transform:translateX(32px)}}
.legs{height:10px;background:repeating-linear-gradient(90deg,transparent 0 60px,var(--concrete) 60px 66px,transparent 66px 124px)}

/* ---- bottom: websites on the line + shipped bay, each paginated to fit */
.bottom{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.bottom{grid-template-columns:minmax(0,1fr) minmax(280px,26%)}}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.cards,.bay{list-style:none;margin:0;padding:0;display:grid;gap:12px;flex:1;min-height:0;align-content:start}
.cards{grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:var(--card-h)}
.bay{grid-auto-rows:var(--crate-h);gap:8px}

.product{background:var(--panel);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;border:2px solid var(--build);min-width:0;display:flex;flex-direction:column}
.product .bar{display:flex;gap:5px;align-items:center;height:24px;padding:0 10px;background:var(--build);flex:none}
.product .bar i{width:7px;height:7px;border-radius:50%;background:rgba(23,24,28,.35)}
.product .bar span{margin-left:auto;color:var(--on-build);font:700 12px/1 var(--display)}
.product .body{padding:8px 12px 10px;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.product h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.at img{width:26px;height:26px;object-fit:contain;flex:none}
.at span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at b{color:var(--ink);font-weight:600}
.product p{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:auto}
.steps i{height:5px;border-radius:3px;background:var(--build-soft)}
.steps i.past{background:color-mix(in srgb,var(--build) 60%,transparent)}
.steps i.here{background:var(--build)}
.foot{font-size:11.5px;color:var(--muted)}
.product.waiting{border-style:dashed}
/* stopped before going live, nobody on it: still on the line, but quiet */
.product.paused{border-color:var(--ash)}
.product.paused .bar{background:var(--ash)}
.product.paused .steps i.here,.product.paused .steps i.past{background:var(--ash)}
.product.arrive{animation:arrive .7s var(--ease)}
@keyframes arrive{from{transform:translateY(-12px);opacity:0}}

.crate{background:var(--live-soft);border:1.5px solid var(--live);border-radius:var(--r-button);padding:5px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;min-width:0}
.crate .tick{grid-row:span 2;width:26px;height:26px;border-radius:var(--r-button);background:var(--live);color:var(--on-live);display:grid;place-items:center}
.crate .tick svg{width:16px;height:16px}
.crate a{font:800 14px/1.2 var(--display);color:var(--live-ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px}
.crate a:hover{text-decoration:underline}
.crate a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.crate small{color:var(--muted);font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);background:var(--panel);border-radius:var(--r-card);padding:16px;text-align:center;grid-column:1/-1;align-self:start}

/* pager — flips on its own every few seconds, pauses while you hover or use it */
.pager{margin-left:auto;display:flex;align-items:center;gap:6px}
.pager[hidden]{display:none}
.pager button{height:32px;min-width:32px;padding:0 10px;border-radius:var(--r-button);border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:600;transition:transform var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease)}
.pager button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pager button:active{transform:translateY(0)}
.pager button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pager .dots{display:flex;gap:5px;padding:0 4px}
.pager .dots i{width:7px;height:7px;border-radius:50%;background:var(--ash)}
.pager .dots i.on{background:var(--ink)}
.pager .label{font-size:12.5px;color:var(--muted);min-width:44px;text-align:center}
.timer{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin:-6px 0 8px}
.timer[hidden]{display:none}
.timer i{display:block;height:100%;background:var(--blue);transform-origin:left;animation:countdown var(--rotate) linear infinite}
.panel.paused .timer i{animation-play-state:paused}
@keyframes countdown{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* AI Team mark */
.credit{display:flex;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);flex:none}
.credit a{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;border-radius:var(--r-pill);padding:3px 10px;background:var(--panel);box-shadow:var(--shadow)}
.credit img{height:16px;width:auto}
.credit a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .station.busy .robot img,.gear,.belt::before,.dot.build,.product.arrive,.pkg .box,.timer i{animation:none}
  .pkg,.packages,.pager button{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><img class="light" src="/brand/logo-lockup-light.svg" alt="Website Factory"><img class="dark" src="/brand/logo-lockup-dark.svg" alt="Website Factory"></h1>
    <span class="conn" id="conn">Connecting…</span>
    <div class="tally" id="tally"></div>
  </header>

  <section class="floor" aria-label="Production line">
    <ul class="stations" id="stations"></ul>
    <div class="markers" id="markers" aria-hidden="true"></div>
    <div class="packages" id="packages"></div>
    <div class="belt" aria-hidden="true"></div><div class="legs" aria-hidden="true"></div>
  </section>

  <div class="bottom">
    <section class="panel" id="run-panel" aria-labelledby="run-h">
      <div class="panel-h"><span class="hicon build" aria-hidden="true"><svg><use href="#gear"/></svg></span><h2 id="run-h">On the line now</h2><div class="pager" id="run-pager" hidden></div></div>
      <div class="timer" id="run-timer" hidden><i></i></div>
      <ul class="cards" id="running"></ul>
    </section>
    <section class="panel" id="bay-panel" aria-labelledby="bay-h">
      <div class="panel-h"><span class="hicon live" aria-hidden="true"><svg><use href="#shipped"/></svg></span><h2 id="bay-h">Shipped today</h2><div class="pager" id="bay-pager" hidden></div></div>
      <div class="timer" id="bay-timer" hidden><i></i></div>
      <ul class="bay" id="bay"></ul>
    </section>
  </div>

  <footer class="credit">
    <a href="https://www.utopiagroup.com.my" target="_blank" rel="noopener"><img class="light" src="/brand/utopia-locked-light.svg" alt="utopia"><img class="dark" src="/brand/utopia-locked-dark.svg" alt="utopia"> AI Team</a>
  </footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gear" viewBox="0 0 24 24"><path fill="currentColor" d="M10.3 2h3.4l.5 2.6a7.6 7.6 0 0 1 1.9.8l2.2-1.5 2.4 2.4-1.5 2.2c.3.6.6 1.2.8 1.9l2.6.5v3.4l-2.6.5a7.6 7.6 0 0 1-.8 1.9l1.5 2.2-2.4 2.4-2.2-1.5c-.6.3-1.2.6-1.9.8l-.5 2.6h-3.4l-.5-2.6a7.6 7.6 0 0 1-1.9-.8l-2.2 1.5-2.4-2.4 1.5-2.2a7.6 7.6 0 0 1-.8-1.9L2 13.7v-3.4l2.6-.5c.2-.7.5-1.3.8-1.9L3.9 5.7l2.4-2.4 2.2 1.5c.6-.3 1.2-.6 1.9-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>
  <!-- a closed parcel (Lucide "package" geometry) -->
  <symbol id="shipped" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="M3.3 7 12 12l8.7-5"/><path d="m7.5 4.27 9 5.15"/></g></symbol>
</svg>

<script>
// Stations in the order a website moves down the line (agents/*.md).
const ORDER = ["alpha","lylia","sora","nana","kagura","kimmy","cyclops","hanabi","layla","gloo"];
const BELT_ROWS = 3;       // packages stacked per station before a "+n more"
const ROTATE_MS = 8000;    // pages flip on their own, like a wall screen
document.documentElement.style.setProperty("--rotate", ROTATE_MS + "ms");
let snap = null, serverSkew = 0;
const lastStation = new Map(); // site → station it was drawn at, to animate a move
const pages = { run: { page: 0, pages: 1, paused: false }, bay: { page: 0, pages: 1, paused: false } };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => Date.now() + serverSkew;
function ago(t){
  if (!t) return "";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m ago";
}
const agoEl = (t) => `<time data-t="${t || ""}">${ago(t)}</time>`;
const cssNum = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));

function renderStations(agents, building){
  // A robot lights up while it is working on a website — which can be a site
  // further down the line coming back to it for a fix.
  document.getElementById("stations").innerHTML = ORDER.map((key) => {
    const a = agents[key];
    const here = building.filter((s) => s.working > 0 && s.robots.includes(key));
    const top = here[0];
    const task = top
      ? `<div class="task"><strong>${esc(here.map((s) => s.name).join(", "))}</strong><span>${esc(top.now)}</span></div>`
      : `<div class="task">Free</div>`;
    return `<li class="station ${top ? "busy" : "idle"}" style="--c:${a.color}">
      <div class="robot"><img src="/agents/${key}.png" alt="" width="64" height="64">${here.length > 1 ? `<span class="count">×${here.length}</span>` : ""}<svg class="gear"><use href="#gear"/></svg></div>
      <b>${a.name}</b><small>${esc(a.role)}</small>${task}</li>`;
  }).join("");
}

// Packages are kept between renders (keyed by site) so a station change
// animates as a slide along the belt instead of a jump.
function renderBelt(building){
  document.getElementById("markers").innerHTML = ORDER.map((k) => `<img src="/agents/${k}.png" alt="">`).join("");
  const box = document.getElementById("packages");
  const byStation = new Map();
  for (const s of building) {
    const idx = s.station ? ORDER.indexOf(s.station) : -1;
    if (!byStation.has(idx)) byStation.set(idx, []);
    byStation.get(idx).push(s);
  }
  const items = [];
  for (const [idx, list] of byStation) {
    const shown = list.length > BELT_ROWS ? list.slice(0, BELT_ROWS - 1) : list;
    shown.forEach((s, row) => items.push({ key: s.key, idx, row, s }));
    if (list.length > shown.length) items.push({ key: `more:${idx}`, idx, row: shown.length, more: list.length - shown.length });
  }
  const seen = new Set();
  for (const it of items) {
    seen.add(it.key);
    let el = box.querySelector(`[data-key="${CSS.escape(it.key)}"]`);
    if (!el) {
      el = document.createElement("div");
      el.dataset.key = it.key;
      el.className = "pkg new";
      el.innerHTML = `<span class="box"><span></span></span>`;
      box.appendChild(el);
      setTimeout(() => el.classList.remove("new"), 700);
    }
    el.classList.toggle("more", !!it.more);
    el.classList.toggle("working", !!it.s && it.s.working > 0);
    el.classList.toggle("waiting", !!it.s && it.s.waitingOnYou);
    el.classList.toggle("paused", !!it.s && it.s.paused);
    el.title = it.s ? `${it.s.name}: ${it.s.station ? "at " + snap.agents[it.s.station].name : "intake"}` : `${it.more} more websites here`;
    el.querySelector(".box span").textContent = it.s ? it.s.name : `+${it.more} more`;
    // Intake (no station yet) waits at the start of the belt, under Alpha.
    el.style.setProperty("--i", Math.max(it.idx, 0));
    el.style.setProperty("--row", it.row);
  }
  for (const el of [...box.children]) if (!seen.has(el.dataset.key)) el.remove();
  const rows = Math.max(1, ...items.map((i) => i.row + 1));
  box.style.setProperty("--h", `${rows * 30 + 8}px`);
}

function product(s, agents){
  const idx = s.station ? ORDER.indexOf(s.station) : -1;
  const moved = lastStation.has(s.key) && lastStation.get(s.key) !== s.station;
  lastStation.set(s.key, s.station);
  const a = s.station ? agents[s.station] : null;
  // robots behind the site's station working on it now are doing a fix, not moving it back
  const back = s.robots.filter((k) => k !== s.station);
  const at = a
    ? `<div class="at"><img src="/agents/${s.station}.png" alt=""><span>At <b>${esc(a.name)}</b> · ${esc(back.length ? "fix by " + back.map((k) => agents[k].name).join(", ") : a.role)}</span></div>`
    : `<div class="at"><img src="/brand/logo-mark-light.svg" alt=""><span>Started, no station yet</span></div>`;
  const steps = ORDER.map((_, i) => `<i class="${i < idx ? "past" : i === idx ? "here" : ""}"></i>`).join("");
  return `<li class="product${s.waitingOnYou ? " waiting" : ""}${s.paused ? " paused" : ""}${moved ? " arrive" : ""}" title="${esc(s.now)}">
    <div class="bar"><i></i><i></i><i></i><span>${s.waitingOnYou ? "Needs you" : s.paused ? "Paused" : "Building"}</span></div>
    <div class="body"><h3>${esc(s.name)}</h3>${at}<p>${esc(s.now || "Waiting for the next step")}</p>
      <div class="steps" title="Station ${idx + 1} of ${ORDER.length}">${steps}</div>
      <div class="foot">${s.working ? `${s.working} ${s.working === 1 ? "agent" : "agents"} working · ` : ""}${agoEl(s.lastAt)}</div></div></li>`;
}

function crate(s){
  return `<li class="crate"><span class="tick" aria-hidden="true"><svg><use href="#shipped"/></svg></span>
    <a href="https://${esc(s.domain)}" target="_blank" rel="noopener" title="${esc(s.name)}">${esc(s.domain)}</a>
    <small>Live · shipped ${agoEl(s.lastAt)}</small></li>`;
}

// How many items fit without scrolling. On a phone the page scrolls, so a
// fixed page size keeps each list short instead.
function capacity(el, itemH, minW){
  const fits = getComputedStyle(document.body).overflow === "hidden";
  const gap = 12;
  const cols = minW ? Math.max(1, Math.floor((el.clientWidth + gap) / (minW + gap))) : 1;
  const rows = fits ? Math.max(1, Math.floor((el.clientHeight + gap) / (itemH + gap))) : (minW ? 3 : 5);
  return { cols, per: cols * rows };
}

function paged(id, list, per){
  const st = pages[id];
  st.pages = Math.max(1, Math.ceil(list.length / per));
  st.page = Math.min(st.page, st.pages - 1);
  const pager = document.getElementById(`${id}-pager`);
  const timer = document.getElementById(`${id}-timer`);
  pager.hidden = timer.hidden = st.pages < 2;
  if (st.pages > 1) {
    pager.innerHTML = `<button type="button" data-go="-1" aria-label="Previous page">‹</button>
      <span class="dots" aria-hidden="true">${Array.from({ length: st.pages }, (_, i) => `<i class="${i === st.page ? "on" : ""}"></i>`).join("")}</span>
      <span class="label">${st.page + 1} / ${st.pages}</span>
      <button type="button" data-go="1" aria-label="Next page">›</button>`;
  }
  return list.slice(st.page * per, st.page * per + per);
}

function render(){
  if (!snap) return;
  const { agents, sites } = snap;
  const building = sites.filter((s) => s.state === "building");
  const done = sites.filter((s) => s.state === "done");
  document.getElementById("tally").innerHTML =
    `<span class="chip build"><span class="dot build"></span>${building.length} building</span>` +
    `<span class="chip live"><span class="dot live"></span>${done.length} live</span>`;
  renderStations(agents, building);
  renderBelt(building);

  const run = document.getElementById("running");
  const rc = capacity(run, cssNum("--card-h"), 250);
  run.style.setProperty("--cols", rc.cols);
  const runPage = paged("run", building, rc.per);
  run.innerHTML = building.length
    ? runPage.map((s) => product(s, agents)).join("")
    : `<li class="empty">No website on the line right now. Start a build and it shows up here within a few seconds.</li>`;

  const bay = document.getElementById("bay");
  const bayPage = paged("bay", done, capacity(bay, cssNum("--crate-h")).per);
  bay.innerHTML = done.length
    ? bayPage.map(crate).join("")
    : `<li class="empty">Nothing shipped yet today. Finished websites land here with their live link.</li>`;
}

// Restart the countdown bar so it lines up with the next flip.
function restartTimers(){
  for (const id of ["run", "bay"]) {
    const i = document.querySelector(`#${id}-timer i`);
    i.style.animation = "none"; void i.offsetWidth; i.style.animation = "";
  }
}

// Pager buttons; pause the auto-flip while someone hovers or uses a panel.
for (const id of ["run", "bay"]) {
  const pager = document.getElementById(`${id}-pager`);
  const panel = document.getElementById(`${id}-panel`);
  pager.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-go]");
    if (!b) return;
    const st = pages[id];
    st.page = (st.page + Number(b.dataset.go) + st.pages) % st.pages;
    render();
    pager.querySelector(`button[data-go="${b.dataset.go}"]`)?.focus();
  });
  const pause = (on) => { pages[id].paused = on; panel.classList.toggle("paused", on); };
  panel.addEventListener("pointerenter", () => pause(true));
  panel.addEventListener("pointerleave", () => pause(false));
  panel.addEventListener("focusin", () => pause(true));
  panel.addEventListener("focusout", () => pause(false));
}
setInterval(() => {
  let flipped = false;
  for (const st of Object.values(pages)) if (st.pages > 1 && !st.paused) { st.page = (st.page + 1) % st.pages; flipped = true; }
  if (flipped) render();
  restartTimers();
}, ROTATE_MS);
let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });

function connect(){
  const conn = document.getElementById("conn");
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    snap = JSON.parse(ev.data);
    serverSkew = snap.now - Date.now();
    conn.textContent = "Live from the Claude sessions on this machine";
    render();
  };
  es.onerror = () => { conn.textContent = "Lost the factory server. Retrying… (is server.mjs still running?)"; };
}
connect();
// Installable as an app (PWA); the worker only caches the shell, never live data.
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// Tick the "Xs ago" labels without a re-render.
setInterval(() => document.querySelectorAll("time[data-t]").forEach((t) => { if (t.dataset.t) t.textContent = ago(+t.dataset.t); }), 1000);
</script>
</body>
