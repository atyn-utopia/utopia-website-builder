name: monitor-scan

# Snapshots every project's checklist + DB rows + live status into the
# monitor_snapshots table. The deployed Utopia Fairy monitor reads from there.

on:
  schedule:
    # Hourly at minute 7 (offset to avoid the rush of jobs at :00).
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'utopia-wizard/**'
      - '.github/workflows/monitor-scan.yml'
  workflow_dispatch:

concurrency:
  group: monitor-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: utopia-wizard/package-lock.json

      - name: Install utopia-wizard deps
        working-directory: utopia-wizard
        run: npm ci

      - name: Run scanner (monorepo projects)
        working-directory: utopia-wizard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Lets vercel-domain-match run in CI exactly as it does locally —
          # without these the check skips and CI snapshots score ~1 lower than a
          # local scan, so the deployed wizard drifts from local. Add VERCEL_TOKEN
          # + VERCEL_TEAM_ID as repo secrets for the two to stay in sync.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: npm run scan

      - name: Run scanner (connected repos — Phase B)
        working-directory: utopia-wizard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Decrypts each user's stored GitHub token so their repo can be cloned.
          WIZARD_TOKEN_KEY: ${{ secrets.WIZARD_TOKEN_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: npm run scan-repos
