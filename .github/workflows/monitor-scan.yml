name: monitor-scan

# Snapshots every project's checklist + DB rows + live status into the
# monitor_snapshots table. The deployed Utopia Fairy monitor reads from there.
#
# The wizard is NOT vendored in this repo any more. It lives in
# utopiagrowth/utopia-wizard (the repo Vercel deploys) and is checked out here at
# the same `utopia-wizard/` path, so every path in this workflow keeps resolving
# exactly as before. The copy that used to live here had drifted 30 files from
# the deployed one in BOTH directions — the scanner graded with 106 checks while
# the app shipped 115, and neither was complete. One checkout, one engine.
#
# Auth: a GitHub App installation token, minted per run and valid for an hour.
# The previous read-only deploy key died when the wizard moved from the
# atyn-utopia org to utopiagrowth, which disables deploy keys for every repo it
# owns — the key is still listed there, permanently greyed out, and checkout
# failed with a misleading "Repository not found" for a week. An App is the one
# credential the org policy allows that also has no expiry to lapse and belongs
# to no single person: WIZARD_APP_ID + WIZARD_APP_PRIVATE_KEY, installed on
# utopiagrowth/utopia-wizard alone with Contents: read.

on:
  schedule:
    # Hourly at minute 7 (offset to avoid the rush of jobs at :00).
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-scan.yml'
  workflow_dispatch:
    inputs:
      # Set by the wizard (/api/scan, and the push webhook) to scan only the
      # repos that changed. Empty = the whole fleet, as before.
      only:
        description: 'Comma-separated project slugs to scan (empty = every connected repo)'
        required: false
        default: ''
        type: string

run-name: ${{ inputs.only && format('monitor-scan · {0}', inputs.only) || 'monitor-scan' }}

# Full scans share one group and never cancel each other. A targeted scan gets
# a group of its own per target, so a burst of pushes to one repo collapses
# into its latest run and never queues behind (or blocks) the full scan.
concurrency:
  group: monitor-scan-${{ inputs.only || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.only != '' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Mint a read-only token for the wizard repo
        id: wizard-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WIZARD_APP_ID }}
          private-key: ${{ secrets.WIZARD_APP_PRIVATE_KEY }}
          owner: utopiagrowth
          repositories: utopia-wizard

      # The scanner clones every connected repo itself, so this job needs the
      # wizard and nothing else from this repository.
      - name: Check out the wizard (single source of truth)
        uses: actions/checkout@v4
        with:
          repository: utopiagrowth/utopia-wizard
          ref: main
          path: utopia-wizard
          token: ${{ steps.wizard-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: utopia-wizard/package-lock.json

      - name: Install utopia-wizard deps
        working-directory: utopia-wizard
        run: npm ci

      - name: Run scanner (connected repos)
        working-directory: utopia-wizard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Decrypts each user's stored GitHub token so their repo can be cloned.
          WIZARD_TOKEN_KEY: ${{ secrets.WIZARD_TOKEN_KEY }}
          # Fallback for repos a user's token cannot see. The wizard signs users
          # in through a classic OAuth App, and utopiagrowth refuses those — so
          # without this the scanner loses every private repo that org holds.
          WIZARD_APP_ID: ${{ secrets.WIZARD_APP_ID }}
          WIZARD_APP_PRIVATE_KEY: ${{ secrets.WIZARD_APP_PRIVATE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # Through env, never interpolated into the script. An --only run
          # skips pruning and owner updates — those need the whole fleet.
          ONLY: ${{ inputs.only }}
        run: npm run scan-repos -- ${ONLY:+"--only=$ONLY"}
