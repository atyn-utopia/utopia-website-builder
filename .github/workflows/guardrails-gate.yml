name: guardrails-gate

# Blocking guardrail gate for pull requests. Fails the PR if any changed project
# has a BLOCKING guardrail failure, a registry/checklist drift, or a score
# regression vs its last stored snapshot (the ratchet — quality may only go up).
#
# Make this a REQUIRED status check in branch protection to actually block merge.

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/guardrails-gate.yml'
  workflow_dispatch:

concurrency:
  group: guardrails-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the merge base to diff changed projects

      - name: Mint a read-only token for the wizard repo
        id: wizard-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WIZARD_APP_ID }}
          private-key: ${{ secrets.WIZARD_APP_PRIVATE_KEY }}
          owner: utopiagrowth
          repositories: utopia-wizard

      # The wizard is no longer vendored here — check it out at the same path so
      # `working-directory: utopia-wizard` and gate.ts's `../projects` lookup
      # keep resolving. GitHub App installation token, see monitor-scan.yml.
      - name: Check out the wizard (single source of truth)
        uses: actions/checkout@v4
        with:
          repository: utopiagrowth/utopia-wizard
          ref: main
          path: utopia-wizard
          token: ${{ steps.wizard-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: utopia-wizard/package-lock.json

      - name: Install utopia-wizard deps
        working-directory: utopia-wizard
        run: npm ci

      - name: Registry ↔ checklist drift guard
        working-directory: utopia-wizard
        run: npm run check-meta:sync

      - name: Guardrails page is up to date
        run: |
          (cd utopia-wizard && npm run guardrails)
          if ! git diff --quiet -- docs/guardrails.html; then
            echo "::error::docs/guardrails.html is stale — run 'npm run guardrails' in utopia-wizard and commit the result."
            git --no-pager diff --stat -- docs/guardrails.html
            exit 1
          fi

      - name: Compute changed projects
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          slugs=$(git diff --name-only "$base" "$head" \
            | grep -E '^projects/[^/]+/' \
            | sed -E 's#^projects/([^/]+)/.*#\1#' \
            | sort -u || true)
          # keep only real projects (have inputs.md)
          keep=""
          for s in $slugs; do
            if [ -f "projects/$s/inputs.md" ]; then keep="$keep $s"; fi
          done
          echo "slugs=$(echo $keep | xargs)" >> "$GITHUB_OUTPUT"
          echo "Changed projects:$keep"

      - name: Run regression gate (no score may drop)
        if: steps.changed.outputs.slugs != ''
        working-directory: utopia-wizard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Lets the vercel-domain-match check ask Vercel what domains the project
          # actually serves. Without these the check skips (never false-fails).
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: npx tsx scripts/gate.ts --regression-only ${{ steps.changed.outputs.slugs }}

      - name: No projects changed
        if: steps.changed.outputs.slugs == ''
        run: echo "No project source changed — guardrail gate skipped. ✓"
